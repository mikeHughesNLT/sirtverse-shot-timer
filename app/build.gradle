plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sirtverse.shottimer'
    compileSdk 36

    defaultConfig {
        applicationId "com.sirtverse.shottimer"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Same proven dependency set as sirtverse-android — no exotic versions.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Milestone 2: CameraX (preview + ImageAnalysis frame tap — see D-006 in DECISIONS.md).
    // camera-camera2 is the CameraX backend; camera-lifecycle wires UseCases to Activity lifecycle.
    // camera-view provides PreviewView. OpenCV arrives at M3 with CameraLaserDetector.
    def camerax_version = '1.4.0'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
