plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sirtverse.shottimer'
    compileSdk 36

    defaultConfig {
        applicationId "com.sirtverse.shottimer"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':detection-core')   // brings CameraX transitively via api

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
