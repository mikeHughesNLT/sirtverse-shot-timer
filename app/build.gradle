plugins {
    id 'com.android.application'
    // Airframe screen (CC-SIRT-APPSHELL-AIRFRAME-001) is Compose; rest of the app stays View/ViewBinding.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

// P0 CC-SIRT-CALIBRATION-CAMPAIGN-002 — version stamping.
// versionName embeds the git short-SHA so the bench conductor can verify the installed
// APK is the intended detector build via:
//   adb shell dumpsys package com.sirtverse.shottimer | grep versionName
// Mismatch = stale APK; conductor refuses the block. (Build-provenance gate, §3 rung 0.)
def gitSha = 'git rev-parse --short HEAD'.execute().text.trim()

android {
    namespace 'com.sirtverse.shottimer'
    compileSdk 36

    defaultConfig {
        applicationId "com.sirtverse.shottimer"
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName "0.2-prototype+${gitSha}"
    }

    // No release keystore for prototype — sign with debug key (acceptable for internal delivery).
    // Replace signingConfigs.release with a production keystore before TestFlight / Play Store.
    signingConfigs {
        release {
            storeFile android.signingConfigs.debug.storeFile
            storePassword android.signingConfigs.debug.storePassword
            keyAlias android.signingConfigs.debug.keyAlias
            keyPassword android.signingConfigs.debug.keyPassword
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':detection-core')   // brings CameraX transitively via api

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Airframe screen only (CC-SIRT-APPSHELL-AIRFRAME-001) — mock-driven, no camera deps.
    // BOM pins mutually-compatible versions; do not hand-pin individual compose artifacts.
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
