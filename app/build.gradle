plugins {
    id 'com.android.application'
    // Airframe screen (CC-SIRT-APPSHELL-AIRFRAME-001) is Compose; rest of the app stays View/ViewBinding.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

android {
    namespace 'com.sirtverse.shottimer'
    compileSdk 36

    defaultConfig {
        applicationId "com.sirtverse.shottimer"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':detection-core')   // brings CameraX transitively via api

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Airframe screen only (CC-SIRT-APPSHELL-AIRFRAME-001) — mock-driven, no camera deps.
    // BOM pins mutually-compatible versions; do not hand-pin individual compose artifacts.
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
