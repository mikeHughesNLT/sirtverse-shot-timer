plugins {
    id 'com.android.application'
}

// P0 CC-SIRT-CALIBRATION-CAMPAIGN-002 — version stamping.
// versionName embeds the git short-SHA so the bench conductor can verify the installed
// APK is the intended detector build via:
//   adb shell dumpsys package com.sirtverse.detectlab | grep versionName
// Mismatch = stale APK; conductor refuses the block. (Build-provenance gate, §3 rung 0.)
def gitSha = 'git rev-parse --short HEAD'.execute().text.trim()

android {
    namespace 'com.sirtverse.detectlab'
    compileSdk 36

    defaultConfig {
        applicationId "com.sirtverse.detectlab"
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName "0.2-prototype+${gitSha}"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':detection-core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
